<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Zomato</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="food.html">Food Menu</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="product.html">Products</a>
        <a href="offers.html">Offers</a>
        <a href="cart.html">My Cart</a>
        <a href="login.html">Login</a>
        <a href="contact.html">Contact Us</a>
    </nav>
</header>

<section class="login-section">

    <div class="login-container">

        <h2>Welcome to Zomato!</h2>
        <p>Login to order your favourite food.</p>

        <form action="#" method="get">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>

            <button type="submit">Login</button>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="#signup">Sign Up</a>
        </p>

        <div id="signup" class="signup-box">
            <h3>Create New Account</h3>

            <form action="#" method="get">

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required>

                <label for="new-email">Email Address</label>
                <input
                    type="email"
                    id="new-email"
                    placeholder="Enter your email"
                    required>

                <label for="new-password">Create Password</label>
                <input
                    type="password"
                    id="new-password"
                    placeholder="Create a password"
                    required>

                <button type="submit">Sign Up</button>

            </form>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 Zomato Website | All Rights Reserved</p>
</footer>

</body>
</html>
